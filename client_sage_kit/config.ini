# ==============================================================
# CONFIGURATION DE L'AGENT SAGE - Universal Invest Strategy
# ==============================================================
# Modifiez les valeurs ci-dessous selon votre installation.
# ==============================================================

[server]
# URL de votre site web heberge (le site que vous avez mis en ligne)
# Exemples :
#   AwardSpace  : https://uis-compta.atwebpages.com
#   ByetHost    : https://uis-compta.byethost.com
#   Autre       : https://votre-domaine.com
url = http://VOTRE-SITE-ICI.atwebpages.com

# Token de securite (doit etre identique a celui configure sur le site)
token = sage_sync_protected_token_2026

[sage]
# Dossier ou les fichiers d'import sont deposes
import_folder = C:\Sage_Import

# Chemin du fichier de format d'import Sage (.ema)
format_file = C:\Sage_Import\FORMAT_UIS.ema

# Chemin du fichier comptable Sage (.mae)
company_file = C:\Users\pc\Desktop\UIS2026.mae

# Chemin de l'executable Sage 100
exe_path = C:\Program Files (x86)\Sage\iComptabilité\Maestria.exe

[sync]
# Intervalle entre chaque synchronisation (en minutes)
interval_minutes = 5

# Demarrer la synchronisation automatiquement au lancement
# (true = demarrage auto, false = demarrage manuel)
auto_start = true
