services:
  - type: web
    name: saas-accounting
    env: docker
    region: frankfurt
    plan: free
    branch: main
    envVars:
      - key: APP_NAME
        value: "Universal Invest Strategy"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://saas-accounting.onrender.com
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: 
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: 
      - key: DB_USERNAME
        value: 
      - key: DB_PASSWORD
        value: 
      - key: SAGE_SYNC_TOKEN
        value: sage_sync_protected_token_2026
