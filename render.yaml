services:
  - type: web
    name: saas-accounting
    env: docker
    region: frankfurt
    plan: free
    branch: main
    envVars:
      - key: APP_NAME
        value: "Universal Invest Strategy"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: single
      - key: LOG_LEVEL
        value: error
      # === BASE DE DONNEES NEON (PostgreSQL) ===
      # Remplacez les 4 lignes suivantes avec vos identifiants Neon
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: 5432
      - key: DB_HOST
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # === SESSION & CACHE (fichier = pas besoin de Redis) ===
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      # === MAIL ===
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        value: yassine2005w@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: yassine2005w@gmail.com
      - key: MAIL_FROM_NAME
        value: "Universal Invest Strategy"
      # === SAGE ===
      - key: SAGE_SYNC_TOKEN
        value: sage_sync_protected_token_2026
